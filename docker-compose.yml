services:
  wex-purchases-api:
    container_name: wex-purchases-api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PurchaseDb: server=wex-mysql;port=3306;database=wex_purchases;user=wex;password=wex123
      ConnectionStrings__Redis: wex-redis:6379
    ports:
      - "8080:8080"
    depends_on:
      wex-mysql:
        condition: service_healthy
      wex-redis:
        condition: service_started
    restart: unless-stopped

  wex-redis:
    image: redis:latest
    container_name: wex-purchases-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  wex-mysql:
    container_name: wex-purchases-mysql
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wex_purchases
      MYSQL_USER: wex
      MYSQL_PASSWORD: wex123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - wex_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    container_name: wex-purchases-sonarqube
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - sonarqube-db
    restart: unless-stopped

  sonarqube-db:
    image: postgres:16-alpine
    container_name: wex-purchases-sonarqube-db
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  wex_mysql_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db_data:
