name: CI/CD - Main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Restore and Build
    uses: ./.github/workflows/ci-develop-build.yml
    with:
      dotnet_version: 10.0.x
      solution_path: src/Wex.Purchases.slnx
      unit_test_project_path: tests/Wex.Purchases.UnitTests/Wex.Purchases.UnitTests.csproj
      integration_test_project_path: tests/Wex.Purchases.IntegrationTests/Wex.Purchases.IntegrationTests.csproj

  tests:
    name: Test - ${{ matrix.suite.name }}
    uses: ./.github/workflows/ci-develop-tests.yml
    strategy:
      fail-fast: true
      matrix:
        suite:
          - name: Unit
            id: unit
            project: tests/Wex.Purchases.UnitTests/Wex.Purchases.UnitTests.csproj
          - name: Integration
            id: integration
            project: tests/Wex.Purchases.IntegrationTests/Wex.Purchases.IntegrationTests.csproj
    with:
      dotnet_version: 10.0.x
      suite_name: ${{ matrix.suite.name }}
      suite_id: ${{ matrix.suite.id }}
      project_path: ${{ matrix.suite.project }}

  format:
    name: Formatting and Code Style
    uses: ./.github/workflows/ci-develop-format.yml
    with:
      dotnet_version: 10.0.x
      solution_path: src/Wex.Purchases.slnx
      unit_test_project_path: tests/Wex.Purchases.UnitTests/Wex.Purchases.UnitTests.csproj
      integration_test_project_path: tests/Wex.Purchases.IntegrationTests/Wex.Purchases.IntegrationTests.csproj

  package:
    name: Build and Push Production Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build
      - tests
      - format
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-develop-package.yml
    with:
      build_context: .
      dockerfile_path: ./Dockerfile
      environment_name: production
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME_PRODUCTION }}

  sonarqube-analysis:
    name: SonarQube Analysis
    needs:
      - package
    uses: ./.github/workflows/ci-develop-sonarqube.yml

  deploy:
    name: Mock Deploy to ECS Production
    needs:
      - package
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    uses: ./.github/workflows/ci-develop-mock-deploy.yml
    with:
      ecs_cluster: ${{ vars.ECS_CLUSTER_PRODUCTION }}
      ecs_service: ${{ vars.ECS_SERVICE_PRODUCTION }}
      environment_name: production
      image_uri: ${{ needs.package.outputs.image_uri }}

  datadog-monitoring:
    name: Datadog Monitoring Setup
    needs:
      - deploy
    uses: ./.github/workflows/ci-develop-datadog.yml
