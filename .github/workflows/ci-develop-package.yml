name: CI Develop - Package

on:
  workflow_call:
    inputs:
      build_context:
        required: true
        type: string
      dockerfile_path:
        required: true
        type: string
      environment_name:
        required: true
        type: string
    secrets:
      AWS_ACCOUNT_ID:
        required: true
      ECR_REPOSITORY:
        required: true
      AWS_ROLE_TO_ASSUME:
        required: true
    outputs:
      image_uri:
        description: Published immutable Docker image URI.
        value: ${{ jobs.package.outputs.image_uri }}

permissions:
  contents: read
  id-token: write

jobs:
  package:
    name: Build and Push ${{ inputs.environment_name }} Image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ${{ inputs.environment_name }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      ENVIRONMENT_NAME: ${{ inputs.environment_name }}
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate AWS package configuration
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          missing=0

          for name in AWS_REGION AWS_ACCOUNT_ID ECR_REPOSITORY AWS_ROLE_TO_ASSUME; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not configured for the ${{ inputs.environment_name }} package job."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-${{ inputs.environment_name }}-package

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tags
        id: image
        run: |
          case "$ENVIRONMENT_NAME" in
            production)
              TAG_PREFIX="prod"
              LATEST_TAG="latest"
              ;;
            development)
              TAG_PREFIX="develop"
              LATEST_TAG="develop-latest"
              ;;
            *)
              TAG_PREFIX="$(echo "$ENVIRONMENT_NAME" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-')"
              LATEST_TAG="${TAG_PREFIX}-latest"
              ;;
          esac

          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${TAG_PREFIX}-${GITHUB_SHA}"
          IMAGE_LATEST="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${LATEST_TAG}"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${IMAGE_LATEST}"
            echo "${IMAGE_URI}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          push: true
          provenance: false
          build-args: |
            BUILD_CONFIGURATION=Release
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
