name: CI/CD - Develop

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.x
  SOLUTION_PATH: src/Wex.Purchases.slnx
  UNIT_TEST_PROJECT_PATH: tests/Wex.Purchases.UnitTests/Wex.Purchases.UnitTests.csproj
  INTEGRATION_TEST_PROJECT_PATH: tests/Wex.Purchases.IntegrationTests/Wex.Purchases.IntegrationTests.csproj
  DOCKERFILE_PATH: ./Dockerfile
  BUILD_CONTEXT: .
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER_DEVELOP }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE_DEVELOP }}
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION_DEVELOP }}
  ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}

jobs:
  build:
    name: Restore and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET SDK with NuGet cache
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            src/Wex.Purchases.slnx
            src/**/*.csproj
            tests/**/*.csproj

      - name: Restore application dependencies
        run: dotnet restore $SOLUTION_PATH --nologo

      - name: Restore unit test dependencies
        run: dotnet restore $UNIT_TEST_PROJECT_PATH --nologo

      - name: Restore integration test dependencies
        run: dotnet restore $INTEGRATION_TEST_PROJECT_PATH --nologo

      - name: Build solution with warnings as errors
        run: dotnet build $SOLUTION_PATH -c Release --no-restore /warnaserror --nologo

      - name: Build unit tests with warnings as errors
        run: dotnet build $UNIT_TEST_PROJECT_PATH -c Release --no-restore /warnaserror --nologo

      - name: Build integration tests with warnings as errors
        run: dotnet build $INTEGRATION_TEST_PROJECT_PATH -c Release --no-restore /warnaserror --nologo

  tests:
    name: Test - ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build

    strategy:
      fail-fast: true
      matrix:
        suite:
          - name: Unit
            id: unit
            project: tests/Wex.Purchases.UnitTests/Wex.Purchases.UnitTests.csproj
          - name: Integration
            id: integration
            project: tests/Wex.Purchases.IntegrationTests/Wex.Purchases.IntegrationTests.csproj

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET SDK with NuGet cache
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            src/Wex.Purchases.slnx
            src/**/*.csproj
            tests/**/*.csproj

      - name: Restore dependencies for test suite
        run: dotnet restore ${{ matrix.suite.project }} --nologo

      - name: Execute ${{ matrix.suite.name }} tests
        run: |
          mkdir -p artifacts/test-results/${{ matrix.suite.id }}
          dotnet test ${{ matrix.suite.project }} \
            -c Release \
            --no-restore \
            --logger "trx;LogFileName=${{ matrix.suite.id }}-tests.trx" \
            --results-directory artifacts/test-results/${{ matrix.suite.id }} \
            --nologo

      - name: Upload ${{ matrix.suite.name }} test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.suite.id }}
          path: artifacts/test-results/${{ matrix.suite.id }}
          if-no-files-found: error
          retention-days: 14

  format:
    name: Formatting and Code Style
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET SDK with NuGet cache
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            src/Wex.Purchases.slnx
            src/**/*.csproj
            tests/**/*.csproj

      - name: Restore dependencies for formatting validation
        run: |
          dotnet restore $SOLUTION_PATH --nologo
          dotnet restore $UNIT_TEST_PROJECT_PATH --nologo
          dotnet restore $INTEGRATION_TEST_PROJECT_PATH --nologo

      - name: Validate formatting for solution
        run: dotnet format $SOLUTION_PATH --verify-no-changes --no-restore --verbosity diagnostic

      - name: Validate formatting for unit tests
        run: dotnet format $UNIT_TEST_PROJECT_PATH --verify-no-changes --no-restore --verbosity diagnostic

      - name: Validate formatting for integration tests
        run: dotnet format $INTEGRATION_TEST_PROJECT_PATH --verify-no-changes --no-restore --verbosity diagnostic

  package:
    name: Build and Push Development Image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs:
      - build
      - tests
      - format
    permissions:
      contents: read
      id-token: write
    environment:
      name: development
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate AWS package configuration
        env:
          AWS_ROLE_TO_ASSUME_DEVELOP: ${{ secrets.AWS_ROLE_TO_ASSUME_DEVELOP }}
        run: |
          missing=0

          for name in AWS_REGION AWS_ACCOUNT_ID ECR_REPOSITORY AWS_ROLE_TO_ASSUME_DEVELOP; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not configured for the development package job."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_DEVELOP }}
          role-session-name: github-actions-develop-package

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tags
        id: image
        run: |
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:develop-${GITHUB_SHA}"
          IMAGE_LATEST="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:develop-latest"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${IMAGE_LATEST}"
            echo "${IMAGE_URI}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          provenance: false
          build-args: |
            BUILD_CONFIGURATION=Release
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sonarqube-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Simulate SonarQube analysis
        run: |
          echo "SonarQube analysis would run here."
          echo "Example steps:"
          echo "- Restore dependencies"
          echo "- Run dotnet sonarscanner begin"
          echo "- Run dotnet build"
          echo "- Run dotnet test with coverage"
          echo "- Run dotnet sonarscanner end"
          echo "SonarQube pipeline stage prepared for enterprise integration."

  create-release-pr:
    name: Create Release Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: package
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.package.result == 'success' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch Git tags
        run: git fetch --tags --force

      - name: Generate release version
        id: version
        run: |
          LATEST_TAG="$(git tag --list 'v*.*.*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"

          if [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="v1.0.0"
            echo "No semantic version tag found. Starting at ${NEW_VERSION}."
          else
            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            PATCH=$((PATCH + 1))
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            echo "Latest semantic version tag found: ${LATEST_TAG}"
          fi

          echo "New version generated: ${NEW_VERSION}"

          if git rev-parse -q --verify "refs/tags/${NEW_VERSION}" >/dev/null; then
            echo "::error::Tag ${NEW_VERSION} already exists. Release PR job cannot continue."
            exit 1
          fi

          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check for existing release pull request
        id: existing_pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
        run: |
          PR_NUMBER="$(gh pr list \
            --base main \
            --head develop \
            --state open \
            --json number \
            --jq '.[0].number // ""')"

          if [ -n "$PR_NUMBER" ]; then
            echo "Open pull request from develop to main already exists: #${PR_NUMBER}"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "No open pull request from develop to main was found."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release pull request token
        if: steps.existing_pr.outputs.exists == 'false'
        env:
          RELEASE_PR_TOKEN_CONFIGURED: ${{ secrets.RELEASE_PR_TOKEN != '' }}
        run: |
          if [ "$RELEASE_PR_TOKEN_CONFIGURED" != "true" ]; then
            echo "::error::The repository does not allow GITHUB_TOKEN to create pull requests. Configure a RELEASE_PR_TOKEN secret with permission to create pull requests before running this job."
            exit 1
          fi

          echo "Release pull request token is configured."

      - name: Ensure pull request labels exist
        if: steps.existing_pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          gh label create release \
            --color "0E8A16" \
            --description "Release pull requests" \
            --force

          gh label create automated-pr \
            --color "1D76DB" \
            --description "Pull requests created by automation" \
            --force

          echo "Pull request labels are available: release, automated-pr."

      - name: Create and push Git tag
        if: steps.existing_pr.outputs.exists == 'false'
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"

          git tag "$NEW_VERSION" "$GITHUB_SHA"
          git push origin "$NEW_VERSION"

          echo "Tag ${NEW_VERSION} created and pushed for commit ${GITHUB_SHA}."

      - name: Create release pull request
        if: steps.existing_pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          cat > pr-body.md <<EOF
          Versão gerada: ${NEW_VERSION}
          Branch origem: develop
          Branch destino: main
          Commit SHA: ${GITHUB_SHA}
          Data da execução: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          Este Pull Request foi criado automaticamente após a conclusão com sucesso do job package.
          EOF

          PR_URL="$(gh pr create \
            --base main \
            --head develop \
            --title "Release ${NEW_VERSION}" \
            --body-file pr-body.md \
            --label release \
            --label automated-pr)"

          echo "Release pull request created: ${PR_URL}"

  deploy:
    name: Deploy to ECS Development
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    if: ${{ false }} # skip  deploy step for now to avoid unintended deployments while testing workflow
    needs:
      - package
    environment:
      name: development
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-development
      cancel-in-progress: false

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_DEVELOP }}
          role-session-name: github-actions-develop-deploy

      - name: Capture current ECS service state
        id: current
        run: |
          mkdir -p artifacts/deploy/development
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            > artifacts/deploy/development/service-before.json

          CURRENT_TASK_DEFINITION=$(jq -r '.services[0].taskDefinition' artifacts/deploy/development/service-before.json)
          echo "current_task_definition=${CURRENT_TASK_DEFINITION}" >> "$GITHUB_OUTPUT"

      - name: Register a new task definition revision
        id: taskdef
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            > artifacts/deploy/development/task-definition-source.json

          CONTAINER_NAME="${ECS_CONTAINER_NAME:-$(jq -r '.containerDefinitions[0].name' artifacts/deploy/development/task-definition-source.json)}"
          IMAGE_URI="${{ needs.package.outputs.image_uri }}"

          jq \
            --arg image "$IMAGE_URI" \
            --arg container "$CONTAINER_NAME" \
            '
              del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .deregisteredAt
              )
              | .containerDefinitions |= map(
                  if .name == $container then
                    .image = $image
                  else
                    .
                  end
                )
            ' \
            artifacts/deploy/development/task-definition-source.json \
            > artifacts/deploy/development/task-definition-rendered.json

          NEW_TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file://artifacts/deploy/development/task-definition-rendered.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "new_task_definition=${NEW_TASK_DEFINITION}" >> "$GITHUB_OUTPUT"

      - name: Update ECS service and wait for stability
        run: |
          for attempt in 1 2 3; do
            echo "Deployment attempt ${attempt} of 3"

            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --task-definition "${{ steps.taskdef.outputs.new_task_definition }}" \
              --force-new-deployment

            if aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "ECS service did not stabilize after 3 attempts." >&2
              exit 1
            fi

            sleep 20
          done

      - name: Collect deployment summary
        if: always()
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            > artifacts/deploy/development/service-after.json

          {
            echo "## Development deploy summary"
            echo ""
            echo "- Cluster: \`$ECS_CLUSTER\`"
            echo "- Service: \`$ECS_SERVICE\`"
            echo "- Previous task definition: \`${{ steps.current.outputs.current_task_definition }}\`"
            echo "- New task definition: \`${{ steps.taskdef.outputs.new_task_definition }}\`"
            echo "- Image: \`${{ needs.package.outputs.image_uri }}\`"
            echo ""
            echo "### Recent ECS events"
            jq -r '.services[0].events[:10][] | "- \(.createdAt): \(.message)"' artifacts/deploy/development/service-after.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-development-artifacts
          path: artifacts/deploy/development
          if-no-files-found: error
          retention-days: 14

  datadog-monitoring:
    name: Datadog Monitoring Setup
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Simulate Datadog configuration
        run: |
          echo "Datadog monitoring configuration would run here."
          echo "Example steps:"
          echo "- Configure DD_API_KEY"
          echo "- Configure DD_SITE"
          echo "- Send deployment marker"
          echo "- Enable logs, metrics and traces"
          echo "Datadog pipeline stage prepared for enterprise integration."          
